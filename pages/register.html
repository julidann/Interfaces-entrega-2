<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GAMEZONE | Crear cuenta</title>

    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <header>
        <nav>
            <img src="../assets/logo/LOGOPAGE.png" alt="">
            <img src="../assets/logo/GAMEZONE.png" alt="">
            <a href="../index.html">Inicio</a>
            <a href="../index.html#plans">Ver planes</a>
            <button class="accent"><a href="login.html">Iniciar sesión</a></button>
        </nav>
    </header>

    <main>
        <section class="landing-main register-main">

            <form class="register-form" id="register-form">
                <h1>Crear una cuenta</h1>

                <div class="form-row">
                    <div class="form-field">
                        <label for="name">Nombre</label>
                        <input id="name" type="text" >
                    </div>

                    <div class="form-field">
                        <label for="lastname">Apellido</label>
                        <input id="lastname" type="text" >
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" >
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="birthdate">Fecha de nacimiento</label>
                        <input id="birthdate" type="date" >
                    </div>

                    <div class="form-field">
                        <label for="username">Nombre de usuario</label>
                        <input id="username" type="text" >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="password">Contraseña</label>
                        <input id="password" type="password" >
                    </div>

                    <div class="form-field">
                        <label for="repeat-password">Repetir contraseña</label>
                        <input id="repeat-password" type="password" >
                    </div>
                </div>

                <div class="captcha">
                    <input type="checkbox">
                    <span>I'm not a robot</span>
                </div>

                <p id="register-message"></p>

                <button class="primary" type="submit">Crear cuenta</button>

                <p class="signin-text">
                    ¿Ya tenés una cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>

                <button class="google-button" type="button">
    <img src="../assets/icons/google.svg" alt="Google">
    Continuar con Google
</button>
            </form>

        </section>
    </main>

    <script src="../js/register-background.js"></script>
    <script src="../js/register.js"></script>

</body>
</html>
