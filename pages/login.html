<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GAMEZONE | Iniciar sesión</title>
    
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/landing/landing.css">
    <link rel="stylesheet" href="../css/auth/auth.css">
    
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/logo/LOGOPAGE.png" alt="GAMEZONE">
                    <img src="../assets/logo/GAMEZONE.png" alt="GAMEZONE">
                </a>
            </div>

            <div class="nav-links">
                <a href="../index.html">Inicio</a>
                <a href="#plans">Ver planes</a>
                <a class="accent" href="login.html">Iniciar sesión</a>
        
            </div> 
        </nav>
    </header>

    <main>
        <section class="landing-main login-main">

            <form class="login-form" id="login-form">
                <h1>Iniciar sesión</h1>

                <div class="form-field">
                    <label for="login-user">Usuario o email *</label>
                    <input id="login-user" type="email">
                </div>

                <div class="form-field">
                    <label for="login-password">Contraseña *</label>
                    <input id="login-password" type="password">
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">Olvidé mi contraseña</a>
                </div>

                <p id="login-message"></p>

                <button type="submit" class="primary login-button">\n                    <span class="button-text">Iniciar sesión</span>\n                    <span class="spinner"></span>\n                </button>

                <p class="signup-text">
                    ¿No tenés cuenta?
                    <a href="register.html">Registrate</a>
                </p>

                <a class="google-button" href="home.html"> 
                    <img src="../assets/icons/google.svg" alt="Google">
                    Continuar con Google
                </a>
                
            </form>

        </section>
    </main>

    <script src="../js/login.js"></script>
    <script src="../js/background-img.js"></script>

</body>
</html>
