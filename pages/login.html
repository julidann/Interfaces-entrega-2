<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GAMEZONE | Iniciar sesión</title>

    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <header>
        <nav>
            <img src="../assets/logo/LOGOPAGE.png" alt="">
            <img src="../assets/logo/GAMEZONE.png" alt="">
            <a href="../index.html">Inicio</a>
            <a href="../index.html#plans">Ver planes</a>
            <button class="accent"><a href="login.html">Iniciar sesión</a></button>
        </nav>
    </header>

    <main>
        <section class="landing-main login-main">

            <form class="login-form" id="login-form">
                <h1>Iniciar sesión</h1>

                <div class="form-field">
                    <label for="login-user">Usuario o email</label>
                    <input id="login-user" type="email">
                </div>

                <div class="form-field">
                    <label for="login-password">Contraseña</label>
                    <input id="login-password" type="password">
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">Olvidé mi contraseña</a>
                </div>

                <p id="login-message"></p>

                <button class="primary" type="submit">Iniciar sesión</button>

                <p class="signup-text">
                    ¿No tenés cuenta?
                    <a href="register.html">Registrate</a>
                </p>

                <button class="google-button" id="google-login" type="button">
                    <img src="../assets/icons/google.svg" alt="Google">
                    Continuar con Google
                </button>
            </form>

        </section>
    </main>

    <script src="../js/login-background.js"></script>
    <script src="../js/login.js"></script>

</body>
</html>
